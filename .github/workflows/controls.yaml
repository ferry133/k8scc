---
# The controls alone, on every pull request: no build, no push, no registry
# login. build.yaml runs the same controls, but only on push to main, so until
# this file existed the only Linux run of a PR's tests came AFTER its merge.
# That is how k8scc#45 merged green on macOS and went red on ubuntu-latest:
# Probe.stop() relied on close() waking a blocked accept(), which Linux does
# not do.
#
# Keep the steps in step with build.yaml's "Check the …" steps. A control
# added there and not here is checked only after merge again.
name: Controls

on:
  pull_request:

jobs:
  controls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the version-assertion controls
        run: test/assert-controls.sh
      - name: Check the ops-image probe controls
        run: test/assert-ops-controls.sh
      - name: Check the bump-explanation controls
        run: python3 test/test_bump_explain.py
      - name: Check the bump-order controls
        run: python3 test/test_bump_order.py
      - name: Check the written-pin cross-check controls
        run: test/bump-pin-check-controls.sh
      - name: Install the Dockerfile's mcp pin
        run: |
          pin=$(grep -o '"mcp==[0-9.]*"' Dockerfile | tr -d '"')
          test -n "$pin" || { echo "no mcp pin found in Dockerfile"; exit 1; }
          python3 -m pip install --quiet "$pin"
      - name: Check the talos-mcp server controls
        run: python3 test/test_talos_mcp_server.py
      - name: Check the netdev-mcp server controls
        run: python3 test/test_netdev_mcp_server.py
      - name: Check the sidecars' stdout carries audit lines only
        run: python3 test/test_mcp_stdout.py
      - name: Check the claude-session controls
        run: test/claude-session-controls.sh
      - name: Check the im policy controls
        run: test/im-policy-controls.sh
      - name: Check the chamber tool controls
        run: test/chamber-controls.sh
      - name: Check the chamber socket and image-default controls
        run: python3 test/test_chamber_tools.py
      - name: Check the chamber client against a real server (a throwaway Synapse)
        # openspec im-chamber-client tasks 2.2 (k8scc#70). The test exits 2 when it
        # cannot start a server; that fails the job, since a run that measured
        # nothing is not a pass. 1.165.0 is what the operator side's bench ran.
        run: |
          python3 -m venv "$RUNNER_TEMP/synapse-venv"
          "$RUNNER_TEMP/synapse-venv/bin/pip" install --quiet "matrix-synapse==1.165.0"
          SYNAPSE_PYTHON="$RUNNER_TEMP/synapse-venv/bin/python" python3 test/test_chamber_client_server.py
      - name: TEMPORARY - the six client mutations on this Synapse (removed before merge)
        run: SYNAPSE_PYTHON="$RUNNER_TEMP/synapse-venv/bin/python" python3 test/chamber-client-mutate.py || true
      - name: Check the chamber-bridge controls
        run: python3 test/test_chamber_bridge.py
      - name: Check the chamber-watch controls
        run: test/chamber-watch-controls.sh
      - name: Check the session-keep controls
        run: test/session-keep-controls.sh
      - name: Check the lan-scan controls
        run: test/lan-scan-controls.sh
      - name: Check the lan-inventory-check controls
        run: |
          pin=$(grep -o '"PyYAML==[0-9.]*"' Dockerfile | tr -d '"')
          test -n "$pin" || { echo "no PyYAML pin found in Dockerfile"; exit 1; }
          python3 -m pip install --quiet "$pin"
          test/lan-inventory-check-controls.sh
      - name: Check the entrypoint secret-service controls
        run: test/entrypoint-controls.sh
