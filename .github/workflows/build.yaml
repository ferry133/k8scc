---
name: Build Claude Code Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: >-
          Rebuild a commit that is already published. This MOVES its short-SHA
          tag: any digest pinned to that tag becomes untagged, and untagged is
          what GHCR retention deletes. Only for recovering a bad publish.
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/claude-code

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The digest the base target is published under. Passed to the bump job
      # so what lands in jg-base can be checked against a second, independent
      # source instead of trusted.
      #
      # Falls back to the gate's already-published digest, because a skipped
      # rebuild leaves `build-base` with no outputs at all. Without the
      # fallback the cross-check downstream compares a real digest against an
      # empty string and fails every re-run -- and a workflow that goes red on
      # a normal re-run is one everyone learns to ignore, which is the
      # blindness the bump job exists to remove.
      base-digest: ${{ steps.build-base.outputs.digest || steps.gate.outputs.base-digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The version assertions in the Dockerfile are what make the build
      # claim "the requested version is present" rather than "the install
      # did not error". Their positive AND negative controls run here, before
      # anything is built, so a check that has stopped being able to fail is
      # caught in this repo rather than by someone reading the image later.
      - name: Check the version-assertion controls
        run: test/assert-controls.sh

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Short-SHA tags stay on one digest (k8scc#3, ferry133 2026-09-13), and
      # the way that is achieved is by not building a commit twice rather than
      # by making two builds produce the same bytes.
      #
      # Reproducibility was the obvious route and it does not work here. The
      # index carries two SLSA provenance attestations besides the two platform
      # manifests, and `tag@sha256:...` names the index -- so anything that
      # moves an attestation moves the pinned digest. Measured on `ca8865a`
      # 2026-09-13: the predicate holds `runDetails.metadata.startedOn` and
      # `finishedOn` at nanosecond precision AND the entire 9.5KB GitHub push
      # event payload. No label setting, `SOURCE_DATE_EPOCH` or
      # `rewrite-timestamp` makes a second run reproduce that, so stability
      # that way is only available by dropping provenance (`provenance: false`).
      # Provenance is kept, so the second build is what goes.
      #
      # This also removes the orphaning it was meant to survive: a pinned
      # digest keeps its tag, so GHCR retention has no untagged version to
      # delete.
      - name: Resolve whether this commit is already published
        id: gate
        env:
          FORCE: ${{ inputs.force_rebuild }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"

          if [ "${FORCE}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::warning::force_rebuild: rebuilding ${SHORT}. Its tags move, and any digest pinned to them becomes untagged."
            exit 0
          fi

          # The registry API rather than `imagetools inspect --format`: this is
          # the load-bearing lookup, and its wrong answer is silent -- an empty
          # result reads as "not published", so the build proceeds and moves the
          # tag while the run stays green. HTTP status can be checked; a Go
          # template that silently resolves to nothing cannot.
          # No `"${ARR[@]}"` for the optional -u: an empty array under `set -u`
          # is an error in bash 3.2, which is what a macOS shell runs when
          # someone tests this outside CI. A check that only works on the
          # machine it was written on is the shape this repo keeps meeting.
          TOKEN_URL="https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io"
          # `if !` rather than a bare call: with `set -e` a failing curl would
          # exit here carrying only curl's own exit code, and the run would say
          # "(56) error: 403" instead of which question went unanswered.
          if [ -n "${GHCR_PAT}" ]; then
            if ! TOKEN_JSON="$(curl -fsS -u "${GITHUB_ACTOR}:${GHCR_PAT}" "${TOKEN_URL}")"; then
              echo "::error::GHCR token endpoint refused the credentialled request for ${IMAGE_NAME}; cannot tell whether ${SHORT} is published"
              exit 1
            fi
          else
            if ! TOKEN_JSON="$(curl -fsS "${TOKEN_URL}")"; then
              echo "::error::GHCR token endpoint refused an anonymous request for ${IMAGE_NAME}; cannot tell whether ${SHORT} is published"
              exit 1
            fi
          fi
          TOKEN="$(printf '%s' "${TOKEN_JSON}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))')"
          if [ -z "${TOKEN}" ]; then
            echo "::error::no GHCR pull token, so whether ${SHORT} is published cannot be determined"
            exit 1
          fi

          # Three outcomes, not two: published / absent / undecidable. Folding
          # "undecidable" into "absent" is what would make this check read the
          # same whether it worked or not -- and the cost of guessing wrong is
          # moving a tag a consumer has pinned.
          CODE=""; DIGEST=""
          lookup() {
            local h; h="$(mktemp)"
            CODE="$(curl -sS -I -o "$h" -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${IMAGE_NAME}/manifests/$1")"
            # awk, not `grep | ...`: grep exits non-zero when a 404 has no such
            # header, and under `pipefail` that killed the script on the most
            # common path of all -- a commit that has never been built. Measured
            # 2026-09-13 before this line looked like this.
            DIGEST="$(awk 'tolower($0) ~ /^docker-content-digest:/ {gsub(/\r/,""); print $2}' "$h")"
            rm -f "$h"
          }

          BASE=""; FACTORY=""; PUBLISHED=0; ABSENT=0
          for TAG in "${SHORT}" "factory-${SHORT}"; do
            lookup "${TAG}"
            case "${CODE}" in
              200)
                if [ -z "${DIGEST}" ]; then
                  echo "::error::${TAG}: HTTP 200 with no docker-content-digest header"
                  exit 1
                fi
                PUBLISHED=$((PUBLISHED + 1))
                echo "${TAG} -> ${DIGEST}"
                if [ "${TAG}" = "${SHORT}" ]; then BASE="${DIGEST}"; else FACTORY="${DIGEST}"; fi
                ;;
              404)
                ABSENT=$((ABSENT + 1))
                echo "${TAG} -> not published"
                ;;
              *)
                echo "::error::${TAG}: registry returned HTTP ${CODE}, so it cannot be told apart from an unpublished tag. Refusing to build, because building moves the tag if it does exist."
                exit 1
                ;;
            esac
          done

          # Both tags or neither. A half-published commit (base pushed, factory
          # failed) has to stay rebuildable, and nothing can be pinned to it:
          # the bump job only runs after this whole job succeeds, so no pin-bump
          # PR was ever opened for that digest.
          if [ "${PUBLISHED}" -eq 2 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "base-digest=${BASE}" >> "$GITHUB_OUTPUT"
            {
              echo "### ${SHORT} is already published -- build skipped"
              echo
              echo "| tag | digest |"
              echo "|---|---|"
              echo "| \`${SHORT}\` | \`${BASE}\` |"
              echo "| \`factory-${SHORT}\` | \`${FACTORY}\` |"
              echo
              echo "Rebuilding would move these tags and orphan any digest pinned to them."
              echo "To rebuild anyway: re-run via \`workflow_dispatch\` with \`force_rebuild\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            if [ "${ABSENT}" -eq 2 ]; then
              echo "${SHORT} is not published yet -- building"
            else
              echo "::notice::${SHORT} is half-published (base='${BASE}' factory='${FACTORY}') -- rebuilding both."
            fi
          fi

      - name: Extract Docker metadata (base)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # target: base is load-bearing. The Dockerfile's last stage is the
      # factory variant, so a build with no target would publish that under
      # the tags existing consumers pin.
      - name: Build and push Docker image
        id: build-base
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (factory variant)
        id: meta-factory
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=factory-,format=short
            type=raw,value=factory-latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Same job, after the base build, deliberately: the factory stage is
      # FROM base, so running it here reuses the layers the step above just
      # built. A parallel matrix job would rebuild every base layer under
      # QEMU for no gain.
      - name: Build and push factory variant
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: factory
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-factory.outputs.tags }}
          labels: ${{ steps.meta-factory.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Bump jg-base's `im` pin to the image this build just pushed.
  #
  # jg-base#66 measured `latest` frozen on spegel clusters: the mirror answers
  # tag queries from node cache, so jg-jiahd ran a months-old image while every
  # signal read green. The fix there was tag@digest. This is the other half --
  # without it the pin is correct and permanently stale, which is the same
  # failure with a different cause.
  #
  # This used to be the job that saved jg-base from a rebuild orphaning its
  # pin, because a rebuild moved the tag (k8scc#3). Since 2026-09-13 the gate
  # in the build job stops a commit being built twice at all, so that case no
  # longer arises: a re-run resolves the same digest, jg-base already pins it,
  # and the no-diff path below skips. Gating on the ref rather than the event
  # is still right -- it keeps the job honest on a re-run instead of assuming
  # one can't happen -- but the orphan it was written for is now prevented
  # upstream rather than repaired here.
  #
  # It stops at "PR opened", deliberately. jg-base's main reaches every cluster
  # through Flux, so merging there is that repo's decision and its owner's to
  # make -- an automation that merged would be deploying to the fleet.
  bump-jg-base-pin:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Secrets cannot be read in a job-level `if`, so the gate is here. A
      # missing token skips the job instead of failing it: the manual path
      # (jg-base scripts/bump-claudecode-image.sh) still works, and a red
      # build on every push would train everyone to ignore this workflow.
      - name: Resolve the cross-repo token
        id: tok
        env:
          DEDICATED: ${{ secrets.JG_BASE_PR_TOKEN }}
          FALLBACK: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "${DEDICATED}" ]; then
            TOKEN="${DEDICATED}"; WHICH=JG_BASE_PR_TOKEN
          elif [ -n "${FALLBACK}" ]; then
            TOKEN="${FALLBACK}"; WHICH=GHCR_TOKEN
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No JG_BASE_PR_TOKEN or GHCR_TOKEN -- skipping the jg-base bump."
            echo "::notice::Run jg-base scripts/bump-claudecode-image.sh ${GITHUB_SHA:0:7} by hand."
            exit 0
          fi

          # Probe push permission rather than discovering it as a checkout
          # failure. GHCR_TOKEN only has to carry write:packages to do its
          # real job, so it may well not reach jg-base -- and a workflow that
          # goes red on every push is one everyone learns to ignore, which is
          # the failure this whole job exists to prevent, one level up.
          if PUSH=$(GH_TOKEN="${TOKEN}" gh api repos/ferry133/jg-base --jq .permissions.push 2>/dev/null) \
             && [ "${PUSH}" = "true" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "using ${WHICH}"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${WHICH} cannot push to ferry133/jg-base (needs 'repo' scope) -- skipping."
            echo "::notice::Set JG_BASE_PR_TOKEN, or run the bump script by hand."
          fi

      - name: Checkout jg-base
        if: steps.tok.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          repository: ferry133/jg-base
          token: ${{ secrets.JG_BASE_PR_TOKEN || secrets.GHCR_TOKEN }}
          path: jg-base

      # jg-base's own script, run from jg-base's checkout -- not a copy of its
      # logic here. The `@sha256` perl-interpolation trap and the "exactly 3
      # sites" guard live in one place, so a copy here cannot keep working
      # after the original changes. k8scc#8 asked for the lessons to be copied
      # across; not having a second implementation is strictly better than
      # copying them.
      - name: Rewrite the pin using jg-base's own script
        if: steps.tok.outputs.have == 'true'
        working-directory: jg-base
        env:
          GH_TOKEN: ${{ secrets.JG_BASE_PR_TOKEN || secrets.GHCR_TOKEN }}
        run: scripts/bump-claudecode-image.sh "${GITHUB_SHA:0:7}"

      # Cross-check, because the script resolves the digest by paging GHCR's
      # package-versions API and this build knows the digest first-hand. Two
      # independent sources agreeing is a measurement; the script's answer
      # alone is a lookup that has a failure mode (a tag older than the
      # pagination window reports "is the CI build done?", which is the wrong
      # diagnosis stated confidently -- ferry133/jg-base issue filed).
      - name: Check the written pin against the digest this build pushed
        if: steps.tok.outputs.have == 'true'
        working-directory: jg-base
        env:
          BUILT_DIGEST: ${{ needs.build-and-push.outputs.base-digest }}
        run: |
          set -euo pipefail
          # Two empty values compare equal and prove nothing. The gate's
          # skip path is exactly where this one could arrive empty, so it is
          # checked before it is compared rather than after it misleads.
          if [ -z "${BUILT_DIGEST}" ]; then
            echo "::error::no base digest: neither a fresh push nor the gate's already-published lookup produced one"
            exit 1
          fi
          F=kubernetes/apps/base/claudecode/claude-code/im/enabled/helmrelease.yaml
          WRITTEN=$(grep -oE 'sha256:[0-9a-f]{64}' "$F" | sort -u)
          echo "written : ${WRITTEN}"
          echo "built   : ${BUILT_DIGEST}"
          if [ "$(printf '%s\n' "${WRITTEN}" | wc -l)" -ne 1 ]; then
            echo "::error::the three sites disagree on the digest"; exit 1
          fi
          if [ "${WRITTEN}" != "${BUILT_DIGEST}" ]; then
            echo "::error::GHCR resolved ${WRITTEN} but this build pushed ${BUILT_DIGEST}"
            exit 1
          fi

      # No diff is the normal outcome of a re-run, not an error.
      - name: Open or update the PR
        if: steps.tok.outputs.have == 'true'
        working-directory: jg-base
        env:
          GH_TOKEN: ${{ secrets.JG_BASE_PR_TOKEN || secrets.GHCR_TOKEN }}
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${FULL_SHA:0:7}"
          BRANCH="bump/claudecode-${SHORT}"

          if git diff --quiet; then
            echo "::notice::jg-base already pins this digest -- nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add kubernetes/apps/base/claudecode/claude-code/im/enabled/helmrelease.yaml
          git commit -m "chore(claudecode): bump im pin to ${SHORT} (k8scc)" \
                     -m "Opened by ferry133/k8scc CI. k8scc#8 - jg-base#66"
          git push -f origin "${BRANCH}"

          # `gh pr list --json number`, not `gh pr view "${BRANCH}"`. The view
          # form went non-zero against an OPEN pull request on 2026-09-13 (run
          # 34762498432: it exited 1 at 14:23:31, and `gh pr create` found
          # jg-base#107 -- open, merged only at 14:28 -- one second later), so
          # the job pushed the branch and then went red on the duplicate.
          #
          # Cause, measured 2026-09-22 rather than inferred from the log: `gh
          # pr view` asks for `projectItems` and `statusCheckRollup`, and
          # `projectItems` needs the `read:project` scope. GHCR_TOKEN is a
          # classic PAT carrying `write:packages` (plus `repo`, which is what
          # the checkout above uses) -- so the field is refused and gh exits 1
          # while every narrower PR query on the same token succeeds. Not
          # proven, because the call discarded its own stderr and the secret
          # cannot be read from outside CI; consistent with everything that is
          # observable. `gh pr list --json number` was checked the same way and
          # requests only `number`/`headRefName`/`states` -- none scope-gated.
          #
          # Three outcomes, not two. A query that could not be answered is not
          # "no PR is open": folding it into that runs `gh pr create` on a
          # branch that already has one, which is exactly how that run failed.
          if ! EXISTING="$(gh pr list --repo ferry133/jg-base --base main \
                             --head "${BRANCH}" --state open \
                             --json number --jq '.[0].number // empty')"; then
            echo "::error::could not ask jg-base whether a PR for ${BRANCH} is open. The branch is pushed; open the PR by hand."
            exit 1
          fi

          if [ -n "${EXISTING}" ]; then
            echo "::notice::jg-base#${EXISTING} for ${BRANCH} is already open -- force-pushed the new digest onto it."
            exit 0
          fi

          # Body written to a file rather than inlined: a heredoc terminator
          # has to sit in column 0 for the shell, which inside a YAML block
          # scalar ends the block instead. Measured the hard way.
          {
            echo "Opened automatically by \`ferry133/k8scc\` CI (k8scc#8)."
            echo
            echo "Bumps the base \`im\` \`tag@digest\` pin to the image k8scc main just built."
            echo
            echo "**Checked, not assumed:** the digest was resolved by this repo's own"
            echo "\`scripts/bump-claudecode-image.sh\` from GHCR, then compared against the digest"
            echo "the k8scc build step itself reported. Two independent sources; the job fails"
            echo "rather than opening this PR if they disagree."
            echo
            echo "**This digest will not move.** Since 2026-09-13 k8scc skips building a commit"
            echo "it has already published, so \`<short-sha>\` is written once and stays on one"
            echo "digest (k8scc#3). A pin to it keeps its tag, so GHCR retention has no untagged"
            echo "version to collect. The one exception is a deliberate \`force_rebuild\` dispatch,"
            echo "which says so in its own run summary."
            echo
            echo "**Not auto-merged on purpose.** This repo's main reaches every cluster through"
            echo "Flux, so merging is this repo's call after its own review."
          } > /tmp/pr-body.md

          gh pr create --repo ferry133/jg-base --base main --head "${BRANCH}" \
            --title "chore(claudecode): bump im pin to ${SHORT}" \
            --body-file /tmp/pr-body.md
